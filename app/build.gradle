plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kida.qqnativeguard'
    compileSdk 34
    // 使用本机已安装的 NDK / build-tools（避免联网下载默认版本）
    ndkVersion "27.3.13750724"
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "io.github.kida.qqnativeguard"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // 启用 prefab，让 CMake 能通过 find_package 找到 ByteHook 的预编译库
    buildFeatures {
        prefab true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    // 使用官方 Xposed API 仓库
    compileOnly 'de.robv.android.xposed:api:82:sources'
    compileOnly 'de.robv.android.xposed:api:82'

    // ByteHook - 字节跳动 PLT hook 框架（预编译 AAR，含 prefab 供 CMake 使用）
    implementation 'com.bytedance:bytehook:1.0.2'
}
